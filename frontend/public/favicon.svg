<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hhGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C3B5E" />
      <stop offset="50%" stop-color="#A8486D" />
      <stop offset="100%" stop-color="#C86D51" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2EC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="hhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3D1223" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Premium Squircle Container -->
  <rect width="64" height="64" rx="18" fill="url(#hhGradient)" />
  
  <!-- Subtle 360-degree Wellness Ring -->
  <circle cx="32" cy="32" r="25" stroke="white" stroke-opacity="0.22" stroke-width="1.8" stroke-dasharray="9 5" stroke-linecap="round"/>

  <!-- Core HerHealth 360 Heart & Clinical Wellness Emblem -->
  <g filter="url(#hhGlow)">
    <path d="M32 47.5 C32 47.5 16 37 16 25 C16 18.5 21 15 26.5 15 C29.5 15 31.5 16.8 32 18.5 C32.5 16.8 34.5 15 37.5 15 C43 15 48 18.5 48 25 C48 37 32 47.5 32 47.5 Z" 
          fill="url(#sparkleGrad)" />
    <!-- Embedded Clinical Care Cross -->
    <path d="M32 23.5 V35.5 M26 29.5 H38" stroke="#8C3B5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="29.5" r="1.8" fill="#C86D51"/>
  </g>
</svg>